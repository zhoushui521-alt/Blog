<svg xmlns="http://www.w3.org/2000/svg" width="680" height="304" viewBox="0 0 680 304" role="img" aria-labelledby="title desc">
  <title id="title">日志和下一轮输入各走一条路径</title>
  <desc id="desc">规划器调用工具。工具结果一边写入日志供人回看，一边返回给规划器，供下一轮决策。</desc>
  <style>
    svg {
      --ink: #0a0a0a;
      --muted: #474747;
      --outline: #dedede;
      --connector: #737373;
      font-family: system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink: #fafafa;
        --muted: #bfbfbf;
        --outline: #454545;
        --connector: #a3a3a3;
      }
    }
    .node { fill: none; stroke: var(--outline); stroke-width: 1.5; }
    .name { fill: var(--ink); font-size: 22px; font-weight: 550; }
    .detail { fill: var(--muted); font-size: 19px; }
    .feedback { fill: var(--muted); font-size: 20px; }
    .route { fill: none; stroke: var(--connector); stroke-width: 1.6; stroke-linejoin: round; }
    .arrowhead { fill: var(--connector); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="arrowhead" d="M0 0L10 5L0 10Z"/>
    </marker>
  </defs>

  <g class="node">
    <rect x="12" y="14" width="172" height="78" rx="12"/>
    <rect x="254" y="14" width="172" height="78" rx="12"/>
    <rect x="496" y="14" width="172" height="78" rx="12"/>
    <rect x="254" y="215" width="172" height="76" rx="12"/>
  </g>
  <g text-anchor="middle">
    <g class="name">
      <text x="98" y="47">规划器</text>
      <text x="340" y="47">工具执行</text>
      <text x="582" y="47">执行结果</text>
      <text x="340" y="247">日志</text>
    </g>
    <g class="detail">
      <text x="98" y="74">读取下一轮输入</text>
      <text x="340" y="74">校验提交的数量</text>
      <text x="582" y="74">成功或报错</text>
      <text x="340" y="274">供人回看</text>
    </g>
    <text class="feedback" x="340" y="160">反馈送回下一轮</text>
  </g>
  <g class="route">
    <path d="M184 53H246" marker-end="url(#arrow)"/>
    <path d="M426 53H488" marker-end="url(#arrow)"/>
    <path d="M582 92V253H434" marker-end="url(#arrow)"/>
    <path d="M582 153H430"/>
    <path d="M250 153H98V100" marker-end="url(#arrow)"/>
  </g>
</svg>
